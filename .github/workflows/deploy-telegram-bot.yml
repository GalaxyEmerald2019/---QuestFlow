name: Deploy QuestFlow Telegram Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-telegram-bot.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Configure Firebase secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" > "$RUNNER_TEMP/telegram-bot-token"
          WEBHOOK_SECRET="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$WEBHOOK_SECRET" > "$RUNNER_TEMP/telegram-webhook-secret"
          firebase functions:secrets:set TELEGRAM_BOT_TOKEN --data-file "$RUNNER_TEMP/telegram-bot-token" --project questflow-app --non-interactive
          firebase functions:secrets:set TELEGRAM_WEBHOOK_SECRET --data-file "$RUNNER_TEMP/telegram-webhook-secret" --project questflow-app --non-interactive
          echo "TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Deploy Telegram webhook
        run: firebase deploy --only functions:telegramWebhook --project questflow-app --non-interactive

      - name: Configure Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          BOT_INFO="$(curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe")"
          echo "$BOT_INFO" | python -c 'import json,sys; d=json.load(sys.stdin); print("Telegram bot:", "@"+d["result"]["username"] if d.get("ok") else "unknown")'

          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setMyCommands"             -H "Content-Type: application/json"             -d '{"commands":[{"command":"start","description":"Запустить QuestFlow Bot"},{"command":"search","description":"Найти игру"},{"command":"deals","description":"Лучшие скидки"},{"command":"wishlist","description":"Мой wishlist"},{"command":"profile","description":"Профиль QuestFlow"},{"command":"settings","description":"Настройки уведомлений"},{"command":"app","description":"Открыть QuestFlow"},{"command":"help","description":"Помощь"}]}' >/dev/null

          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook"             --data-urlencode "url=https://europe-west1-questflow-app.cloudfunctions.net/telegramWebhook"             --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET"             --data-urlencode "drop_pending_updates=false"

      - name: Verify webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo" |             python -c 'import json,sys; d=json.load(sys.stdin)["result"]; print("Webhook:", d.get("url")); print("Pending updates:", d.get("pending_update_count")); print("Last error:", d.get("last_error_message","none"))'

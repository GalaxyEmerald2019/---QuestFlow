name: QuestFlow Telegram Notifications

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telegram-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate notification configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['TELEGRAM_BOT_TOKEN', 'FIREBASE_SERVICE_ACCOUNT'];
          const missing = required.filter(name => !process.env[name]?.trim());
          for (const name of missing) {
            console.error(`::error::Missing GitHub Actions secret: ${name}`);
          }
          if (missing.length) {
            console.error('Add these secrets in Settings > Secrets and variables > Actions.');
            process.exit(1);
          }
          console.log('Required notification secrets are configured.');
          NODE

      - name: Install bot dependencies
        run: npm install

      - name: Check wishlist discounts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          QUESTFLOW_WEB_URL: ${{ vars.QUESTFLOW_WEB_URL }}
          MIN_DISCOUNT_PERCENT: '5'
        run: npm run check:discounts

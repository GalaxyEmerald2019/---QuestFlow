name: Import QuestFlow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source QuestFlow
        run: git clone --depth 1 --branch master https://github.com/Ariscion/QuestFlow.git /tmp/questflow-source

      - name: Replace repository contents
        run: rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/questflow-source/ ./

      - name: Commit imported project
        run: |
          git config user.name "QuestFlow Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import QuestFlow project"
            git push origin HEAD:main
          fi
